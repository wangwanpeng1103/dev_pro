services:
  mysql:
    image: mysql:8.4
    container_name: devpro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devpro}
      MYSQL_USER: ${MYSQL_USER:-devpro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: devpro-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MIHOTEL_CLEAR_CACHE_TRUNK_TARGETS: ${MIHOTEL_CLEAR_CACHE_TRUNK_TARGETS:-}
      MIHOTEL_CLEAR_CACHE_LOCAL_TARGETS: ${MIHOTEL_CLEAR_CACHE_LOCAL_TARGETS:-}
      MIHOTEL_CLEAR_CACHE_READ_TIMEOUT_SECONDS: ${MIHOTEL_CLEAR_CACHE_READ_TIMEOUT_SECONDS:-180}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: devpro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
