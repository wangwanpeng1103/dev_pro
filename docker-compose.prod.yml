services:
  mysql:
    image: mysql:8.4
    container_name: devpro-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dev_pro}
      MYSQL_USER: ${MYSQL_USER:-devpro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-prod-data:/var/lib/mysql
      - ./database/schema/20260629_001_create_ops_console_tables.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/seed/20260629_001_init_ops_console_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./database/migration/20260702_001_add_cloud_checkin_project.sql:/docker-entrypoint-initdb.d/003_cloud_checkin_project.sql:ro
      - ./database/migration/20260702_002_fix_ops_console_utf8mb4.sql:/docker-entrypoint-initdb.d/004_fix_ops_console_utf8mb4.sql:ro
      - ./database/migration/20260713_001_create_tmh_mock_company.sql:/docker-entrypoint-initdb.d/005_create_tmh_mock_company.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: devpro-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-dev_pro}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:-devpro}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD}}
      MIHOTEL_CLEAR_CACHE_TRUNK_TARGETS: ${MIHOTEL_CLEAR_CACHE_TRUNK_TARGETS:-}
      MIHOTEL_CLEAR_CACHE_LOCAL_TARGETS: ${MIHOTEL_CLEAR_CACHE_LOCAL_TARGETS:-}
      MIHOTEL_CLEAR_CACHE_READ_TIMEOUT_SECONDS: ${MIHOTEL_CLEAR_CACHE_READ_TIMEOUT_SECONDS:-180}
      MIHOTEL_SYSTEM_PARAM_TRUNK_BASE_URL: ${MIHOTEL_SYSTEM_PARAM_TRUNK_BASE_URL:-}
      MIHOTEL_SYSTEM_PARAM_LOCAL_BASE_URL: ${MIHOTEL_SYSTEM_PARAM_LOCAL_BASE_URL:-}
      MIHOTEL_SYSTEM_PARAM_READ_TIMEOUT_SECONDS: ${MIHOTEL_SYSTEM_PARAM_READ_TIMEOUT_SECONDS:-60}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: devpro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql-prod-data:
